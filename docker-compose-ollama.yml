services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ollama_data:/root/.ollama
    command: ["serve"]
    networks:
      - ai_bridge
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local

networks:
  ai_bridge:
    name: n8n_ai_bridge
    driver: bridge
