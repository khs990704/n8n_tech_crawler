services:
  fastapi:
    image: python:3.12-slim
    container_name: fastapi_server
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn app:app --host 0.0.0.0 --port 8100"
    ports:
      - "8100:8100"
    restart: unless-stopped
