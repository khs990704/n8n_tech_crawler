services:
  db:
    image: postgres:16
    container_name: n8n_db
    environment:
      - POSTGRES_DB=${N8N_DB_NAME}
      - POSTGRES_USER=${N8N_DB_USER}
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
      - TZ=Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    networks:
      - ai_bridge
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER}"]
      interval: 1m30s
      timeout: 30s
      retries: 5

  migrate:
    image: flyway/flyway:10
    container_name: n8n_db_migrate
    depends_on:
      db:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://db:5432/${N8N_DB_NAME}
      -user=${N8N_DB_USER}
      -password=${N8N_DB_PASSWORD}
      -locations=filesystem:/flyway/sql
      -baselineOnMigrate=true
      -connectRetries=60
      migrate
    volumes:
      - ./db/migration:/flyway/sql
    networks:
      - ai_bridge
    restart: "no"

volumes:
  n8n_db_data:
    driver: local

networks:
  ai_bridge:
    name: n8n_ai_bridge
    driver: bridge
