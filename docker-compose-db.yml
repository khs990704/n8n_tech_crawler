services:
  db:
    image: postgres:16
    container_name: n8n_db
    environment:
      - POSTGRES_DB=n8n_db
      - POSTGRES_USER=hskim
      - POSTGRES_PASSWORD=guiyomi7471@?
      - TZ=Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hskim"]
      interval: 1m30s
      timeout: 30s
      retries: 5

  migrate:
    image: flyway/flyway:10
    container_name: n8n_db_migrate
    depends_on:
      db:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://db:5432/n8n_db
      -user=hskim
      -password=guiyomi7471@?
      -locations=filesystem:/flyway/sql
      -baselineOnMigrate=true
      -connectRetries=60
      migrate
    volumes:
      - ./db/migration:/flyway/sql
    restart: "no"

volumes:
  n8n_db_data:
    driver: local
